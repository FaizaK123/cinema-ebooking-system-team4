<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Cinema E-Booking System</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="nav-bar">
        <button class="nav-bar-home-button" id="nav-bar-home-btn">CES</button>
    </nav>
    <main class="login-page-content forgot-password">
        <h1 class="login-page-title">Forgot Password</h1>
        <h4 class="login-page-descr">Enter email to get link to reset password.</h4>
        <form class="login-form forgot-password" id="forgot-password-form">
            <div class="login-form-section">
                <label class="login-form-label forgot-password" for="fp-email">Email *</label>
                <input type="email" id="fp-email" name="email" required />
            </div>
            <p class="forgot-password-error" id="forgot-password-error" role="alert" hidden>
                No account was found with that email address.
            </p>
            <button class="login-form-button" type="submit">Continue</button>
            <a class="login-form-return-btn" href="Login_Page.html"><i class="fa-solid fa-chevron-left"></i>Back to Login</a>
        </form>
    </main>
</body>
</html>
