<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Cinema E-Booking System</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/api.js" defer></script>
    <script src="js/script.js" defer></script>
    <script src="js/account.js" defer></script>
</head>
<body>
    <nav class="nav-bar">
        <button class="nav-bar-home-button" id="nav-bar-home-btn">CES</button>
    </nav>
    <main class="login-page-content forgot-password">
        <h1 class="login-page-title">Forgot Password</h1>
        <h4 class="login-page-descr">Enter your account's email and we'll send you a link to reset your password.</h4>
        <form class="login-form forgot-password account-form" id="forgot-password-form" novalidate>
            <p class="required-note"><span class="required">*</span> Required field</p>
            <div class="login-form-section">
                <label class="login-form-label forgot-password" for="fp-email">Email <span class="required">*</span></label>
                <input class="form-input" type="email" id="fp-email" name="email" data-field="email" autocomplete="email" required />
                <p class="field-error" data-error-for="email" hidden></p>
            </div>
            <p class="form-message" id="forgot-password-message" role="status" hidden></p>
            <button class="login-form-button" type="submit">Send Reset Link</button>
            <a class="login-form-return-btn" href="Login_Page.html"><i class="fa-solid fa-chevron-left"></i>Back to Login</a>
        </form>
    </main>
</body>
</html>
