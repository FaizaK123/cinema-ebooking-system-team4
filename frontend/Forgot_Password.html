<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Cinema E-Booking System</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/api.js" defer></script>
    <script src="js/script.js" defer></script>
    <script src="js/account.js" defer></script>
</head>
<body>
    <nav class="nav-bar">
        <button class="nav-bar-home-button" id="nav-bar-home-btn">CES</button>
    </nav>
    <main class="login-page-content forgot-password">
        <h1 class="login-page-title">Reset Password</h1>
        <h4 class="login-page-descr">Choose a new password and enter it twice to confirm.</h4>
        <form class="login-form forgot-password account-form" id="reset-password-form" novalidate>
            <p class="required-note"><span class="required">*</span> Required field</p>
            <p class="form-message" id="reset-password-message" role="alert" hidden></p>
            <div class="login-form-section">
                <label class="login-form-label" for="new-password">New Password <span class="required">*</span></label>
                <div class="password-controls">
                    <input class="form-input" type="password" id="new-password" data-field="password" autocomplete="new-password" required aria-describedby="new-password-hint" />
                    <button class="password-toggle" type="button" data-toggle-password aria-controls="new-password" aria-label="Show password" aria-pressed="false" title="Show password"><i class="fa-solid fa-eye"></i></button>
                </div>
                <p class="field-hint" id="new-password-hint">At least 8 characters, with an uppercase letter, a lowercase letter and a number.</p>
                <p class="field-error" data-error-for="password" hidden></p>
            </div>
            <div class="login-form-section">
                <label class="login-form-label" for="confirm-password">Confirm New Password <span class="required">*</span></label>
                <input class="form-input" type="password" id="confirm-password" data-field="confirmPassword" autocomplete="new-password" required />
                <p class="field-error" data-error-for="confirmPassword" hidden></p>
            </div>
            <button class="login-form-button" type="submit">Change Password</button>
            <a class="login-form-return-btn" id="reset-new-link" href="Forgot_Password_Request.html" hidden>Request a new reset link</a>
            <a class="login-form-return-btn" href="Login_Page.html"><i class="fa-solid fa-chevron-left"></i>Back to Login</a>
        </form>
    </main>
</body>
</html>
