<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Cinema E-Booking System</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="nav-bar">
        <button class="nav-bar-home-button" id="nav-bar-home-btn">CES</button>
    </nav>
    <main class="login-page-content forgot-password">
        <h1 class="login-page-title">Reset Password</h1>
        <h4 class="login-page-descr">Enter your new password twice to confirm.</h4>
        <form class="login-form forgot-password" id="reset-password-form">
            <div class="login-form-section">
                <label class="login-form-label" for="new-password">New Password *</label>
                <input type="password" id="new-password" name="new-password" autocomplete="new-password" required />
            </div>
            <div class="login-form-section">
                <label class="login-form-label" for="confirm-password">Confirm New Password *</label>
                <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required />
            </div>
            <p class="forgot-password-error" id="reset-password-error" role="alert" hidden></p>
            <p class="forgot-password-success" id="reset-password-success" role="status" hidden>
                Password changed successfully. The change is only simulated until a backend is connected.
            </p>
            <button class="login-form-button" type="submit">Change Password</button>
            <a class="login-form-return-btn" href="Login_Page.html"><i class="fa-solid fa-chevron-left"></i>Back to Login</a>
        </form>
    </main>
</body>
</html>
