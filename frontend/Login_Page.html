<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema E-Booking System</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="nav-bar">
        <button class="nav-bar-home-button" id="nav-bar-home-btn">CES</button>
    </nav>
    <div class="login-page-content">
        <h1 class="login-page-title">Login</h1>
        <h4 class="login-page-descr">Enter a username or email and password to login.</h4>
        <form class="login-form">
            <div class="login-form-section user">
                <label class="login-form-label user">Username or Email *</label>
                <input type="text" id="user" required />
            </div>
            <div class="login-form-section password">
                <label class="login-form-label password">Password *</label>
                <input type="text" id="password" required />
            </div>
            <div class="login-form-section forgot-password">
                <button class="login-form-forgot-password" type="submit" formnovalidate formaction="Forgot_Password_Request.html">Forgot Password?</button>
            </div>
            <button class="login-form-button">Login</button>
        </form>
    </div>
</body>
